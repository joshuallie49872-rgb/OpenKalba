<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <defs>
    <!-- same padding + rounded corners style -->
    <clipPath id="clip">
      <rect x="0" y="5" width="36" height="26" rx="4" ry="4"></rect>
    </clipPath>

    <!-- 5-point star centered at (0,0); scale + translate via transform -->
    <polygon id="star" points="
      0,-1
      0.293,-0.404
      0.951,-0.309
      0.475,0.155
      0.588,0.809
      0,0.5
      -0.588,0.809
      -0.475,0.155
      -0.951,-0.309
      -0.293,-0.404
    "></polygon>
  </defs>

  <g clip-path="url(#clip)">
    <!-- 13 stripes (2 units tall each) -->
    <rect x="0" y="5" width="36" height="26" fill="#FFFFFF"></rect>
    <rect x="0" y="5" width="36" height="2" fill="#B22234"></rect>
    <rect x="0" y="9" width="36" height="2" fill="#B22234"></rect>
    <rect x="0" y="13" width="36" height="2" fill="#B22234"></rect>
    <rect x="0" y="17" width="36" height="2" fill="#B22234"></rect>
    <rect x="0" y="21" width="36" height="2" fill="#B22234"></rect>
    <rect x="0" y="25" width="36" height="2" fill="#B22234"></rect>
    <rect x="0" y="29" width="36" height="2" fill="#B22234"></rect>

    <!-- canton -->
    <rect x="0" y="5" width="16" height="14" fill="#3C3B6E"></rect>

    <!-- 50 stars: 9 rows, alternating 6 and 5 -->
    <!-- tuned for this exact tiny tile: readable + correct pattern -->
    <g fill="#FFFFFF">
      <!-- star size -->
      <!-- scale 0.75 makes them visible but not blobs -->
      <!-- row Y positions (within y=5..19) -->
      <!-- 6-star rows x: 1.5 4.0 6.5 9.0 11.5 14.0 -->
      <!-- 5-star rows x: 2.75 5.25 7.75 10.25 12.75 -->

      <!-- Row 1 (6) -->
      <use href="#star" transform="translate(1.5,6.2) scale(0.75)"></use>
      <use href="#star" transform="translate(4.0,6.2) scale(0.75)"></use>
      <use href="#star" transform="translate(6.5,6.2) scale(0.75)"></use>
      <use href="#star" transform="translate(9.0,6.2) scale(0.75)"></use>
      <use href="#star" transform="translate(11.5,6.2) scale(0.75)"></use>
      <use href="#star" transform="translate(14.0,6.2) scale(0.75)"></use>

      <!-- Row 2 (5) -->
      <use href="#star" transform="translate(2.75,7.7) scale(0.75)"></use>
      <use href="#star" transform="translate(5.25,7.7) scale(0.75)"></use>
      <use href="#star" transform="translate(7.75,7.7) scale(0.75)"></use>
      <use href="#star" transform="translate(10.25,7.7) scale(0.75)"></use>
      <use href="#star" transform="translate(12.75,7.7) scale(0.75)"></use>

      <!-- Row 3 (6) -->
      <use href="#star" transform="translate(1.5,9.2) scale(0.75)"></use>
      <use href="#star" transform="translate(4.0,9.2) scale(0.75)"></use>
      <use href="#star" transform="translate(6.5,9.2) scale(0.75)"></use>
      <use href="#star" transform="translate(9.0,9.2) scale(0.75)"></use>
      <use href="#star" transform="translate(11.5,9.2) scale(0.75)"></use>
      <use href="#star" transform="translate(14.0,9.2) scale(0.75)"></use>

      <!-- Row 4 (5) -->
      <use href="#star" transform="translate(2.75,10.7) scale(0.75)"></use>
      <use href="#star" transform="translate(5.25,10.7) scale(0.75)"></use>
      <use href="#star" transform="translate(7.75,10.7) scale(0.75)"></use>
      <use href="#star" transform="translate(10.25,10.7) scale(0.75)"></use>
      <use href="#star" transform="translate(12.75,10.7) scale(0.75)"></use>

      <!-- Row 5 (6) -->
      <use href="#star" transform="translate(1.5,12.2) scale(0.75)"></use>
      <use href="#star" transform="translate(4.0,12.2) scale(0.75)"></use>
      <use href="#star" transform="translate(6.5,12.2) scale(0.75)"></use>
      <use href="#star" transform="translate(9.0,12.2) scale(0.75)"></use>
      <use href="#star" transform="translate(11.5,12.2) scale(0.75)"></use>
      <use href="#star" transform="translate(14.0,12.2) scale(0.75)"></use>

      <!-- Row 6 (5) -->
      <use href="#star" transform="translate(2.75,13.7) scale(0.75)"></use>
      <use href="#star" transform="translate(5.25,13.7) scale(0.75)"></use>
      <use href="#star" transform="translate(7.75,13.7) scale(0.75)"></use>
      <use href="#star" transform="translate(10.25,13.7) scale(0.75)"></use>
      <use href="#star" transform="translate(12.75,13.7) scale(0.75)"></use>

      <!-- Row 7 (6) -->
      <use href="#star" transform="translate(1.5,15.2) scale(0.75)"></use>
      <use href="#star" transform="translate(4.0,15.2) scale(0.75)"></use>
      <use href="#star" transform="translate(6.5,15.2) scale(0.75)"></use>
      <use href="#star" transform="translate(9.0,15.2) scale(0.75)"></use>
      <use href="#star" transform="translate(11.5,15.2) scale(0.75)"></use>
      <use href="#star" transform="translate(14.0,15.2) scale(0.75)"></use>

      <!-- Row 8 (5) -->
      <use href="#star" transform="translate(2.75,16.7) scale(0.75)"></use>
      <use href="#star" transform="translate(5.25,16.7) scale(0.75)"></use>
      <use href="#star" transform="translate(7.75,16.7) scale(0.75)"></use>
      <use href="#star" transform="translate(10.25,16.7) scale(0.75)"></use>
      <use href="#star" transform="translate(12.75,16.7) scale(0.75)"></use>

      <!-- Row 9 (6) -->
      <use href="#star" transform="translate(1.5,18.2) scale(0.75)"></use>
      <use href="#star" transform="translate(4.0,18.2) scale(0.75)"></use>
      <use href="#star" transform="translate(6.5,18.2) scale(0.75)"></use>
      <use href="#star" transform="translate(9.0,18.2) scale(0.75)"></use>
      <use href="#star" transform="translate(11.5,18.2) scale(0.75)"></use>
      <use href="#star" transform="translate(14.0,18.2) scale(0.75)"></use>
    </g>
  </g>
</svg>
