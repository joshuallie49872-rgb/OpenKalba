<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <defs>
    <clipPath id="r">
      <rect x="0" y="5" width="36" height="26" rx="4" ry="4"/>
    </clipPath>
  </defs>

  <g clip-path="url(#r)">
    <!-- White field -->
    <rect x="0" y="5" width="36" height="26" fill="#FFFFFF"/>
    <!-- Red disc (Japan official ratio: 3/5 of height) -->
    <circle cx="18" cy="18" r="7.8" fill="#BC002D"/>
    <!-- Very thin inner border to match Egypt style -->
    <rect x="0.15" y="5.15" width="35.7" height="25.7" rx="3.85" ry="3.85"
          fill="none" stroke="#000000" stroke-width="0.3"/>
  </g>
</svg>
